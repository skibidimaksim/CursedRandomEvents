
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.skibidimaksim.cursedrandomevents'

base {
    archivesName = 'CursedRandomEvents'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.11.45'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        cursedrandomevents {
            sourceSet sourceSets.main
        }
    }
}
